  <circle cx="32" cy="32" r="16" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
  <path d="M28 24.5 L41 32 L28 39.5 Z" fill="#ffffff" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
