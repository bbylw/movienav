    <style>
      :root {
        --bg-primary: #09090b;
        --bg-card: #121217;
        --bg-card-hover: #181820;
        --accent: #e50914;
        --accent-light: #ff3b47;
        --accent-dim: rgba(229, 9, 20, 0.12);
        --accent-glow: rgba(229, 9, 20, 0.24);
        --text-primary: #f4f4f7;
        --text-secondary: #a09fa9;
        --text-muted: #757482;
        --border: rgba(255, 255, 255, 0.065);
        --border-hover: rgba(255, 255, 255, 0.14);
        --radius-lg: 16px;
        --radius-md: 12px;
        --radius-sm: 6px;
        --z-base: 1;
        --z-floating: 90;
        --z-header: 100;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
        --gutter: calc(max(0px, (100vw - 1400px) / 2) + 5vw);
        --font-cjk: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      }

      html {
        scroll-behavior: smooth;
        -webkit-text-size-adjust: 100%;
      }

      ::selection {
        background: var(--accent);
        color: #fff;
      }

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "DM Sans", -apple-system, BlinkMacSystemFont, var(--font-cjk);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: var(--bg-primary);
        color: var(--text-primary);
        line-height: 1.5;
        min-height: 100dvh;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
      }

      /* ── Ambient background glow (single composited layer) ── */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        contain: strict;
        background:
          radial-gradient(ellipse 75% 55% at 15% -5%, rgba(229, 9, 20, 0.1) 0%, transparent 60%),
          radial-gradient(ellipse 55% 45% at 88% 85%, rgba(120, 15, 45, 0.06) 0%, transparent 55%),
          radial-gradient(ellipse 60% 40% at 50% 45%, rgba(24, 24, 38, 0.35) 0%, transparent 65%);
      }

      /* ── Header ── */
      .header {
        padding: 20px var(--gutter);
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: var(--z-header);
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid transparent;
        transition:
          padding 0.45s var(--ease),
          background-color 0.3s var(--ease),
          border-color 0.3s var(--ease),
          box-shadow 0.3s var(--ease);
      }

      .header.scrolled {
        padding-block: 13px;
        background: rgba(9, 9, 11, 0.82);
        backdrop-filter: blur(20px) saturate(1.4);
        -webkit-backdrop-filter: blur(20px) saturate(1.4);
        border-bottom-color: var(--border);
        box-shadow: 0 10px 30px -15px rgba(0, 0, 0, 0.7);
      }

      .logo-container {
        display: flex;
        align-items: center;
        gap: 12px;
        color: inherit;
        text-decoration: none;
      }

      .logo-mark {
        width: 36px;
        height: 36px;
        background: linear-gradient(145deg, var(--accent-light), #b80710);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.8125rem;
        color: #fff;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.28),
          0 6px 20px -4px rgba(229, 9, 20, 0.45);
        transition:
          transform 0.4s var(--ease),
          box-shadow 0.4s var(--ease);
      }

      .logo-mark i {
        margin-left: 2px;
      }

      .logo-container:hover .logo-mark {
        transform: scale(1.07) rotate(-4deg);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.35),
          0 8px 24px -3px rgba(229, 9, 20, 0.65);
      }

      .site-name {
        font-family: "Space Grotesk", var(--font-cjk);
        color: var(--text-primary);
        font-size: 1.2rem;
        font-weight: 700;
        letter-spacing: -0.025em;
      }

      .header-stats {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 0.78rem;
        color: var(--text-secondary);
        letter-spacing: 0.03em;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }

      .header-stats > span {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 13px;
        border: 1px solid var(--border);
        border-radius: 100px;
        background: rgba(255, 255, 255, 0.025);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }

      .pulse-dot {
        width: 6px;
        height: 6px;
        background: #34d399;
        border-radius: 50%;
        animation: pulse 2.4s var(--ease) infinite;
      }

      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.5);
        }
        70%,
        100% {
          box-shadow: 0 0 0 6px rgba(52, 211, 153, 0);
        }
      }

      /* ── Hero ── */
      .hero {
        position: relative;
        z-index: var(--z-base);
        padding: 136px var(--gutter) 44px;
      }

      .hero-label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 5px 13px;
        background: linear-gradient(135deg, rgba(229, 9, 20, 0.16), rgba(229, 9, 20, 0.06));
        border: 1px solid rgba(229, 9, 20, 0.25);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        border-radius: 100px;
        font-size: 0.75rem;
        color: #ff4d57;
        font-weight: 600;
        letter-spacing: 0.08em;
        margin-bottom: 22px;
        animation: fadeUp 0.8s var(--ease) 0.08s backwards;
      }

      .hero-label i {
        font-size: 0.625rem;
      }

      .hero-title {
        font-family: "Space Grotesk", var(--font-cjk);
        font-size: clamp(2.35rem, 4.8vw, 3.85rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.14;
        margin-bottom: 18px;
        max-width: 700px;
        text-wrap: balance;
        animation: fadeUp 0.8s var(--ease) 0.16s backwards;
      }

      .hero-title .accent {
        background: linear-gradient(135deg, #ff4752 0%, #e50914 55%, #b80710 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .hero-desc {
        font-size: 1.02rem;
        color: var(--text-secondary);
        max-width: 520px;
        line-height: 1.75;
        text-wrap: pretty;
        animation: fadeUp 0.8s var(--ease) 0.24s backwards;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ── Main content ── */
      .main-content {
        position: relative;
        z-index: var(--z-base);
        flex: 1;
        padding: 12px var(--gutter) 96px;
      }

      /* ── Sites grid ── */
      .sites-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
        gap: 16px;
      }

      /* ── Site card ── */
      .site-card {
        --index: 0;
        display: flex;
        flex-direction: column;
        color: inherit;
        text-decoration: none;
        background: var(--bg-card);
        border-radius: var(--radius-lg);
        overflow: hidden;
        padding: 24px;
        border: 1px solid var(--border);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.04),
          0 4px 20px -6px rgba(0, 0, 0, 0.35);
        position: relative;
        isolation: isolate;
        contain: layout paint;
        transition:
          transform 0.45s var(--ease),
          background-color 0.3s var(--ease),
          border-color 0.3s var(--ease),
          box-shadow 0.45s var(--ease);
        animation: cardIn 0.65s var(--ease) calc(var(--index) * 45ms + 0.2s) backwards;
      }

      @keyframes cardIn {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Top specular rim highlight */
      .site-card::after {
        content: "";
        position: absolute;
        top: 0;
        left: 12%;
        right: 12%;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.14),
          transparent
        );
        opacity: 0.6;
        transition:
          opacity 0.35s var(--ease),
          background 0.35s var(--ease);
        pointer-events: none;
      }

      /* Spotlight gradient on hover */
      .site-card::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background: radial-gradient(
          520px circle at var(--mouse-x, 50%) var(--mouse-y, 0%),
          rgba(229, 9, 20, 0.085),
          transparent 45%
        );
        opacity: 0;
        transition: opacity 0.4s var(--ease);
        pointer-events: none;
      }

      .site-card:hover::before,
      .site-card:focus-visible::before {
        opacity: 1;
      }

      .site-card:hover::after,
      .site-card:focus-visible::after {
        opacity: 1;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(229, 9, 20, 0.5),
          transparent
        );
      }

      .site-card:hover,
      .site-card:focus-visible {
        background: var(--bg-card-hover);
        border-color: var(--border-hover);
        transform: translateY(-4px);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.08),
          0 22px 44px -14px rgba(0, 0, 0, 0.7),
          0 0 28px -10px rgba(229, 9, 20, 0.22);
      }

      .site-card:active {
        transform: translateY(-1px) scale(0.985);
        transition-duration: 0.15s;
      }

      .card-icon-wrap {
        width: 44px;
        height: 44px;
        margin-bottom: 16px;
        border-radius: var(--radius-md);
        background: linear-gradient(135deg, rgba(229, 9, 20, 0.16), rgba(229, 9, 20, 0.06));
        border: 1px solid rgba(229, 9, 20, 0.2);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          background 0.3s var(--ease),
          border-color 0.3s var(--ease),
          transform 0.45s var(--ease),
          box-shadow 0.3s var(--ease);
      }

      .site-card:hover .card-icon-wrap,
      .site-card:focus-visible .card-icon-wrap {
        background: linear-gradient(135deg, rgba(229, 9, 20, 0.28), rgba(229, 9, 20, 0.12));
        border-color: rgba(229, 9, 20, 0.4);
        transform: scale(1.06);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.16),
          0 6px 18px -4px rgba(229, 9, 20, 0.35);
      }

      .card-icon-wrap i {
        color: #ff333e;
        font-size: 1.08rem;
      }

      .site-title {
        font-family: "Space Grotesk", var(--font-cjk);
        font-size: 1.125rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin-bottom: 8px;
        color: var(--text-primary);
      }

      .site-desc {
        font-size: 0.875rem;
        color: var(--text-secondary);
        line-height: 1.68;
        margin-bottom: 20px;
        text-wrap: pretty;
      }

      .site-tags {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        margin-top: auto;
      }

      .tag {
        padding: 4px 10px;
        border-radius: var(--radius-sm);
        font-size: 0.74rem;
        font-weight: 500;
        background: rgba(255, 255, 255, 0.035);
        color: var(--text-secondary);
        border: 1px solid rgba(255, 255, 255, 0.05);
        transition:
          background-color 0.3s var(--ease),
          color 0.3s var(--ease),
          border-color 0.3s var(--ease);
      }

      .site-card:hover .tag,
      .site-card:focus-visible .tag {
        background: var(--accent-dim);
        color: #ff5861;
        border-color: rgba(229, 9, 20, 0.2);
      }

      /* ── Footer ── */
      .footer {
        position: relative;
        z-index: var(--z-base);
        margin: 0 var(--gutter);
        padding: 32px 0 40px;
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .footer-text {
        font-size: 0.8rem;
        color: var(--text-muted);
      }

      /* ── Back to top ── */
      .back-to-top {
        position: fixed;
        bottom: 32px;
        right: 32px;
        z-index: var(--z-floating);
        width: 44px;
        height: 44px;
        border-radius: var(--radius-md);
        border: 1px solid var(--border);
        background: rgba(12, 12, 16, 0.82);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        opacity: 0;
        pointer-events: none;
        transform: translateY(8px);
        transition:
          opacity 0.3s var(--ease),
          transform 0.5s var(--ease),
          background-color 0.3s var(--ease),
          border-color 0.3s var(--ease),
          color 0.3s var(--ease);
      }

      .back-to-top.visible {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }

      .back-to-top:hover {
        background: var(--bg-card-hover);
        border-color: var(--border-hover);
        color: var(--text-primary);
      }

      .back-to-top:active {
        transform: scale(0.95);
      }

      /* ── Responsive ── */
      @media (max-width: 768px) {
        .hero {
          padding: 112px var(--gutter) 32px;
        }

        .header-stats {
          display: none;
        }

        .sites-grid {
          gap: 12px;
        }

        .site-card {
          padding: 20px;
        }

        .footer {
          flex-direction: column;
          gap: 16px;
          text-align: center;
        }

        .back-to-top {
          bottom: 20px;
          right: 20px;
        }
      }

      @media (max-width: 480px) {
        .hero {
          padding: 96px var(--gutter) 24px;
        }

        .site-name {
          font-size: 1.1rem;
        }
      }

      @media (min-width: 1800px) {
        .sites-grid {
          grid-template-columns: repeat(4, 1fr);
        }
      }

      /* ── Reduced motion ── */
      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-delay: 0s !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

    <script>
      (() => {
        const header = document.getElementById("header");
        const backToTop = document.getElementById("back-to-top");
        const container = document.getElementById("sites-container");
        const template = document.getElementById("site-card-template");
        const { sites } = JSON.parse(document.getElementById("sites-data").textContent);

        const fragment = document.createDocumentFragment();

        sites.forEach((site, idx) => {
          const card = template.content.firstElementChild.cloneNode(true);
          card.href = site.url;
          card.setAttribute("aria-label", `${site.name}，在新标签页打开`);
          card.style.setProperty("--index", idx);

          card.querySelector(".card-icon-wrap i").className = site.icon || "fa-solid fa-play";
          card.querySelector(".site-title").textContent = site.name;
          card.querySelector(".site-desc").textContent = site.description;

          const tagsContainer = card.querySelector(".site-tags");
          site.tags.forEach(tagText => {
            const tag = document.createElement("span");
            tag.className = "tag";
            tag.textContent = tagText;
            tagsContainer.appendChild(tag);
          });

          fragment.appendChild(card);
        });

        container.replaceChildren(fragment);

        // rAF-throttled spotlight with cached bounding rect (avoids layout thrashing)
        let activeCard = null;
        let activeRect = null;
        let pointerRaf = 0;
        let lastX = 0;
        let lastY = 0;

        const updateSpotlight = () => {
          pointerRaf = 0;
          if (!activeCard || !activeRect) return;
          activeCard.style.setProperty("--mouse-x", `${Math.round(lastX - activeRect.left)}px`);
          activeCard.style.setProperty("--mouse-y", `${Math.round(lastY - activeRect.top)}px`);
        };

        container.addEventListener(
          "pointerover",
          e => {
            if (e.pointerType === "touch") return;
            const card = e.target.closest(".site-card");
            if (card && card !== activeCard) {
              activeCard = card;
              activeRect = card.getBoundingClientRect();
            }
          },
          { passive: true }
        );

        container.addEventListener(
          "pointermove",
          e => {
            if (e.pointerType === "touch" || !activeCard) return;
            lastX = e.clientX;
            lastY = e.clientY;
            if (!pointerRaf) {
              pointerRaf = requestAnimationFrame(updateSpotlight);
            }
          },
          { passive: true }
        );

        container.addEventListener(
          "pointerleave",
          () => {
            activeCard = null;
            activeRect = null;
          },
          { passive: true }
        );

        // Scroll state synchronization
        let scrollTicking = false;
        const syncScrollState = () => {
          const y = window.scrollY;
          header.classList.toggle("scrolled", y > 40);
          backToTop.classList.toggle("visible", y > 400);
          activeRect = null;
          scrollTicking = false;
        };

        syncScrollState();

        window.addEventListener(
          "scroll",
          () => {
            if (!scrollTicking) {
              requestAnimationFrame(syncScrollState);
              scrollTicking = true;
            }
          },
          { passive: true }
        );

        backToTop.addEventListener("click", () => {
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      })();
    </script>
