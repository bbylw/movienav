    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"

    <style>
      :root {
        --bg-primary: #0a0a0c;
        --bg-card: #131318;
        --bg-card-hover: #1a1a22;
        --accent: #e50914;
        --accent-dim: rgba(229, 9, 20, 0.12);
        --accent-glow: rgba(229, 9, 20, 0.25);
        --text-primary: #f0eff4;
        --text-secondary: #8a8994;
        --text-muted: #5a5968;
        --border: rgba(255, 255, 255, 0.06);
        --border-hover: rgba(255, 255, 255, 0.12);
        --radius: 16px;
        --radius-sm: 8px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "DM Sans", -apple-system, BlinkMacSystemFont, sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        line-height: 1.5;
        min-height: 100dvh;
        overflow-x: hidden;
      }

      /* ── Noise texture overlay ── */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        opacity: 0.03;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        background-repeat: repeat;
        background-size: 200px 200px;
      }

      /* ── Gradient mesh background ── */
      .bg-mesh {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background:
          radial-gradient(ellipse 80% 60% at 10% 0%, rgba(229, 9, 20, 0.08) 0%, transparent 60%),
          radial-gradient(ellipse 60% 50% at 90% 80%, rgba(80, 20, 60, 0.06) 0%, transparent 50%),
          radial-gradient(ellipse 50% 40% at 50% 50%, rgba(20, 20, 40, 0.3) 0%, transparent 60%);
      }

      /* ── Header ── */
      .header {
        padding: 20px 5%;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 999;
        display: flex;
        align-items: center;
        justify-content: space-between;
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .header.scrolled {
        padding: 14px 5%;
        background: rgba(10, 10, 12, 0.85);
        backdrop-filter: blur(24px) saturate(1.2);
        -webkit-backdrop-filter: blur(24px) saturate(1.2);
        border-bottom: 1px solid var(--border);
      }

      .logo-container {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .logo-mark {
        width: 36px;
        height: 36px;
        background: var(--accent);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        color: #fff;
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .logo-mark:hover {
        transform: scale(1.1) rotate(-4deg);
      }

      .site-name {
        font-family: "Space Grotesk", sans-serif;
        color: var(--text-primary);
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: -0.5px;
      }

      .header-stats {
        display: flex;
        align-items: center;
        gap: 20px;
        font-size: 0.8rem;
        color: var(--text-muted);
        letter-spacing: 0.5px;
        text-transform: uppercase;
        font-weight: 500;
      }

      .header-stats span {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .pulse-dot {
        width: 6px;
        height: 6px;
        background: #34d399;
        border-radius: 50%;
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(0.8); }
      }

      /* ── Hero ── */
      .hero {
        position: relative;
        z-index: 1;
        padding: 140px 5% 60px;
        max-width: 1400px;
        margin: 0 auto;
      }

      .hero-label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        background: var(--accent-dim);
        border: 1px solid rgba(229, 9, 20, 0.2);
        border-radius: 100px;
        font-size: 0.75rem;
        color: var(--accent);
        font-weight: 600;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        margin-bottom: 24px;
        opacity: 0;
        transform: translateY(12px);
        animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
      }

      .hero-title {
        font-family: "Space Grotesk", sans-serif;
        font-size: clamp(2.4rem, 5vw, 4rem);
        font-weight: 700;
        letter-spacing: -2px;
        line-height: 1.1;
        margin-bottom: 20px;
        max-width: 700px;
        opacity: 0;
        transform: translateY(16px);
        animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
      }

      .hero-title .accent {
        color: var(--accent);
      }

      .hero-desc {
        font-size: 1.05rem;
        color: var(--text-secondary);
        max-width: 520px;
        line-height: 1.7;
        opacity: 0;
        transform: translateY(16px);
        animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.35s forwards;
      }

      @keyframes fadeUp {
        to { opacity: 1; transform: translateY(0); }
      }



      /* ── Main content ── */
      .main-content {
        position: relative;
        z-index: 1;
        padding: 20px 5% 80px;
        max-width: 1400px;
        margin: 0 auto;
      }

      .section-header {
        display: flex;
        align-items: baseline;
        gap: 16px;
        margin-bottom: 32px;
      }

      .section-title {
        font-family: "Space Grotesk", sans-serif;
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.5px;
      }

      .section-count {
        font-size: 0.85rem;
        color: var(--text-muted);
        font-weight: 500;
      }

      /* ── Sites grid – masonry-style layout ── */
      .sites-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 16px;
      }

      /* ── Site card ── */
      .site-card {
        --index: 0;
        background: var(--bg-card);
        border-radius: var(--radius);
        overflow: hidden;
        cursor: pointer;
        padding: 28px;
        border: 1px solid var(--border);
        position: relative;
        transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        opacity: 0;
        transform: translateY(20px);
        animation: cardIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) calc(var(--index) * 60ms + 0.4s) forwards;
      }

      @keyframes cardIn {
        to { opacity: 1; transform: translateY(0); }
      }

      /* Spotlight gradient on hover */
      .site-card::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          600px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
          rgba(229, 9, 20, 0.06),
          transparent 40%
        );
        opacity: 0;
        transition: opacity 0.4s ease;
        pointer-events: none;
        border-radius: var(--radius);
      }

      .site-card:hover::before {
        opacity: 1;
      }

      .site-card:hover {
        background: var(--bg-card-hover);
        border-color: var(--border-hover);
        transform: translateY(-4px);
        box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.4);
      }

      .site-card:active {
        transform: translateY(-2px) scale(0.98);
      }

      .card-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      .card-icon-wrap {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: var(--accent-dim);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .site-card:hover .card-icon-wrap {
        background: var(--accent-glow);
        transform: scale(1.08);
      }

      .card-icon-wrap i {
        color: var(--accent);
        font-size: 1.1rem;
      }

      .card-arrow {
        color: var(--text-muted);
        font-size: 0.85rem;
        opacity: 0;
        transform: translate(-4px, 4px);
        transition: all 0.3s ease;
      }

      .site-card:hover .card-arrow {
        opacity: 1;
        transform: translate(0, 0);
        color: var(--accent);
      }

      .site-title {
        font-family: "Space Grotesk", sans-serif;
        font-size: 1.15rem;
        font-weight: 600;
        letter-spacing: -0.3px;
        margin-bottom: 8px;
        color: var(--text-primary);
      }

      .site-desc {
        font-size: 0.88rem;
        color: var(--text-secondary);
        line-height: 1.65;
        margin-bottom: 20px;
      }

      .site-tags {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }

      .tag {
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 0.75rem;
        font-weight: 500;
        background: rgba(255, 255, 255, 0.04);
        color: var(--text-muted);
        border: 1px solid rgba(255, 255, 255, 0.04);
        transition: all 0.25s ease;
        letter-spacing: 0.2px;
      }

      .site-card:hover .tag {
        background: var(--accent-dim);
        color: var(--accent);
        border-color: rgba(229, 9, 20, 0.15);
      }

      /* ── Footer ── */
      .footer {
        position: relative;
        z-index: 1;
        padding: 40px 5%;
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        max-width: 1400px;
        margin: 0 auto;
      }

      .footer-text {
        font-size: 0.8rem;
        color: var(--text-muted);
      }

      .footer-links {
        display: flex;
        gap: 20px;
      }

      .footer-links a {
        color: var(--text-muted);
        text-decoration: none;
        font-size: 0.8rem;
        transition: color 0.2s;
      }

      .footer-links a:hover {
        color: var(--text-primary);
      }

      /* ── Back to top ── */
      .back-to-top {
        position: fixed;
        bottom: 32px;
        right: 32px;
        z-index: 998;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(10, 10, 12, 0.8);
        backdrop-filter: blur(16px);
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        opacity: 0;
        pointer-events: none;
        transform: translateY(8px);
        transition: all 0.3s ease;
      }

      .back-to-top.visible {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }

      .back-to-top:hover {
        background: var(--bg-card-hover);
        border-color: var(--border-hover);
        color: var(--text-primary);
      }

      /* ── Responsive ── */
      @media (max-width: 768px) {
        .hero {
          padding: 120px 5% 40px;
        }

        .hero-title {
          letter-spacing: -1px;
        }

        .header-stats {
          display: none;
        }

        .sites-grid {
          grid-template-columns: 1fr;
          gap: 12px;
        }

        .site-card {
          padding: 22px;
        }

        .footer {
          flex-direction: column;
          gap: 16px;
          text-align: center;
        }
      }

      @media (max-width: 480px) {
        .hero {
          padding: 110px 5% 32px;
        }

        .site-name {
          font-size: 1.1rem;
        }

        .search-bar input {
          padding: 12px 16px 12px 44px;
          font-size: 0.9rem;
        }
      }

      @media (min-width: 1800px) {
        .sites-grid {
          grid-template-columns: repeat(4, 1fr);
        }
      }

      /* ── Reduced motion ── */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

    <script>
      (() => {
        const header = document.getElementById("header");
        const backToTop = document.getElementById("back-to-top");
        const container = document.getElementById("sites-container");
        const sitesData = JSON.parse(document.getElementById("sites-data").textContent);
        const sites = sitesData.sites;

        // ── Render cards
        function renderCards() {
          container.innerHTML = "";
          sites.forEach((site, idx) => {
            const card = document.createElement("div");
            card.className = "site-card";
            card.style.setProperty("--index", idx);
            card.innerHTML = `
              <div class="card-top">
                <div class="card-icon-wrap"><i class="${site.icon}"></i></div>
                <i class="fa-solid fa-arrow-up-right card-arrow"></i>
              </div>
              <h3 class="site-title">${site.name}</h3>
              <p class="site-desc">${site.description}</p>
              <div class="site-tags">${site.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
            `;
            card.addEventListener("click", () => window.open(site.url, "_blank", "noopener"));

            // Spotlight effect
            card.addEventListener("mousemove", e => {
              const rect = card.getBoundingClientRect();
              card.style.setProperty("--mouse-x", `${e.clientX - rect.left}px`);
              card.style.setProperty("--mouse-y", `${e.clientY - rect.top}px`);
            });

            container.appendChild(card);
          });

        }

        renderCards();

        // ── Scroll events
        let ticking = false;
        window.addEventListener("scroll", () => {
          if (!ticking) {
            requestAnimationFrame(() => {
              header.classList.toggle("scrolled", window.scrollY > 40);
              backToTop.classList.toggle("visible", window.scrollY > 400);
              ticking = false;
            });
            ticking = true;
          }
        });

        backToTop.addEventListener("click", () => {
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      })();
    </script>
